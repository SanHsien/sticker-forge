<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sticker-forge</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>sticker-forge</h1>
      <p data-i18n="subtitle">LINE 靜態貼圖本機製作台</p>
    </div>
    <div class="top-actions">
      <label class="language-field">
        <span data-i18n="languageLabel">語言</span>
        <select id="ui-language">
          <option value="zh-Hant">繁體中文</option>
          <option value="en">English</option>
        </select>
      </label>
      <div class="status" id="status" data-i18n="statusReady">等待素材</div>
    </div>
  </header>

  <main class="layout">
    <section class="panel prompt-panel">
      <div class="section-head">
        <h2>Prompt</h2>
        <button id="copy-prompt" type="button" data-i18n="copy">複製</button>
      </div>

      <div class="preset-row">
        <label><span data-i18n="presetLabel">主題預設</span>
          <select id="preset-select"></select>
        </label>
      </div>

      <div class="field-grid">
        <label><span data-i18n="character">角色</span><input id="character" list="dl-character" value="原創可愛角色"></label>
        <label><span data-i18n="theme">主題</span><input id="theme" list="dl-theme" value="日常聊天貼圖"></label>
        <label><span data-i18n="tone">語氣</span><input id="tone" list="dl-tone" value="可愛、清楚、友善"></label>
        <label><span data-i18n="promptLanguage">語言</span><input id="language" list="dl-language" value="繁體中文"></label>
        <label class="wide"><span data-i18n="style">風格</span><input id="style" list="dl-style" value="粗黑線、扁平上色、適合聊天視窗縮圖閱讀"></label>
      </div>

      <datalist id="dl-character"></datalist>
      <datalist id="dl-theme"></datalist>
      <datalist id="dl-tone"></datalist>
      <datalist id="dl-style"></datalist>
      <datalist id="dl-language"></datalist>
      <datalist id="dl-text"></datalist>
      <datalist id="dl-action"></datalist>

      <div class="toolbar">
        <label class="check"><input id="with-text" type="checkbox" checked> <span data-i18n="withText">有字版</span></label>
        <label><span data-i18n="background">背景色</span>
          <select id="chroma-key">
            <option value="green">Green #00FF00</option>
            <option value="magenta">Magenta #FF00FF</option>
          </select>
        </label>
      </div>

      <div class="slots" id="slots"></div>
      <textarea id="prompt-output" spellcheck="false"></textarea>
    </section>

    <section class="panel work-panel">
      <div class="section-head">
        <h2>Grid</h2>
        <div class="grid-imports">
          <label class="file-button">
            <span data-i18n="importGrid">匯入 3x3</span>
            <input id="grid-file" type="file" accept="image/*">
          </label>
          <label class="file-button ghost">
            <span data-i18n="addGrid">加入 grid</span>
            <input id="add-grid-file" type="file" accept="image/*">
          </label>
        </div>
      </div>

      <div class="stage" id="dropzone">
        <canvas id="source-canvas" width="360" height="360"></canvas>
        <p class="drop-hint" data-i18n="dropHint">把 3x3 圖拖放到這裡，或用上方「匯入 3x3」</p>
      </div>

      <div class="actions">
        <button id="split-grid" type="button" data-i18n="split">切圖</button>
        <button id="cleanup-all" type="button" data-i18n="cleanup">去背</button>
        <button id="select-first-eight" type="button" data-i18n="selectFirstEight">選前 8 張</button>
        <button id="clear-tiles" type="button" data-i18n="clearTiles">清空</button>
        <button id="export-stickers" type="button" data-i18n="exportPng">匯出 9 張 PNG</button>
        <button id="export-emoji" type="button" data-i18n="exportEmoji">匯出 LINE emoji</button>
        <button id="export-message" type="button" data-i18n="exportMessage">匯出訊息貼圖</button>
        <button id="export-zip" type="button" class="primary" data-i18n="exportZip">匯出 ZIP</button>
      </div>

      <div class="export-controls">
        <label><span data-i18n="mainLabel">主圖</span>
          <select id="main-index"></select>
        </label>
        <label><span data-i18n="tabLabel">聊天標籤</span>
          <select id="tab-index"></select>
        </label>
      </div>

      <div class="export-controls">
        <label><span data-i18n="packTitle">套組標題</span>
          <input id="pack-title" placeholder="sticker-forge pack">
        </label>
        <label><span data-i18n="packAuthor">作者</span>
          <input id="pack-author" placeholder="sticker-forge">
        </label>
      </div>

      <div class="export-controls">
        <label><span data-i18n="cleanupTune">去背強度</span>
          <select id="cleanup-tune">
            <option value="safe" data-i18n="tuneSafe">保守</option>
            <option value="balanced" selected data-i18n="tuneBalanced">平衡</option>
            <option value="aggressive" data-i18n="tuneAggressive">強力</option>
          </select>
        </label>
        <label><span data-i18n="padding">Padding</span>
          <input id="sticker-padding" type="range" min="0" max="40" step="2" value="10">
        </label>
        <output id="padding-value">10 px</output>
      </div>

      <div class="export-controls">
        <label><span data-i18n="platformLabel">其他平台</span>
          <select id="platform-target">
            <option value="telegram">Telegram · 512</option>
            <option value="whatsapp">WhatsApp · 512 WebP</option>
            <option value="discord">Discord · 320</option>
            <option value="signal">Signal · 512</option>
          </select>
        </label>
        <button id="export-platform" type="button" data-i18n="exportPlatform">匯出到平台</button>
      </div>

      <section class="export-preview" aria-live="polite">
        <div class="section-head compact">
          <h2 data-i18n="exportPreview">匯出前預覽</h2>
          <span id="selection-summary">0 / 8</span>
        </div>
        <ul id="preview-errors"></ul>
        <div id="preview-files" class="preview-files"></div>
      </section>

      <details class="submission">
        <summary data-i18n="submissionTitle">LINE Creators Market 上架</summary>
        <ol>
          <li data-i18n="submission1">到 creator.line.me 登入 LINE 帳號。</li>
          <li data-i18n="submission2">新增 Sticker，填寫貼圖介紹、圖片編輯、販售資訊。</li>
          <li data-i18n="submission3">在圖片編輯頁上傳整包 ZIP，或逐張上傳 main.png、tab.png、01.png 到 08.png。</li>
          <li data-i18n="submission4">三個區段完成後點「申請販售」。通過後再手動點「上架」。</li>
        </ol>
      </details>

      <div class="tile-grid" id="tile-grid"></div>
    </section>
  </main>

  <div id="zoom-modal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <span id="zoom-title"></span>
        <button id="zoom-close" type="button" aria-label="close">✕</button>
      </div>
      <div class="zoom-stage"><img id="zoom-img" alt="preview"></div>
      <div class="modal-actions">
        <button id="zoom-clean" type="button" data-i18n="cleanupOne">去背這張</button>
        <button id="zoom-reset" type="button" data-i18n="resetOne">還原</button>
        <button id="zoom-png" type="button" data-i18n="savePng">存 PNG</button>
      </div>
    </div>
  </div>

  <template id="slot-template">
    <div class="slot-row">
      <span class="slot-num"></span>
      <input class="slot-text" list="dl-text" aria-label="文字">
      <input class="slot-action" list="dl-action" aria-label="動作">
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
