<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sticker-forge</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>sticker-forge</h1>
      <p data-i18n="subtitle">LINE 靜態貼圖本機製作台</p>
    </div>
    <div class="top-actions">
      <label class="language-field">
        <span data-i18n="languageLabel">語言</span>
        <select id="ui-language">
          <option value="zh-Hant">繁體中文</option>
          <option value="en">English</option>
        </select>
      </label>
      <div class="status" id="status" data-i18n="statusReady">等待素材</div>
    </div>
  </header>

  <main class="layout">
    <section class="panel prompt-panel">
      <div class="section-head">
        <h2>Prompt</h2>
        <button id="copy-prompt" type="button" data-i18n="copy">複製</button>
      </div>

      <div class="field-grid">
        <label><span data-i18n="character">角色</span><input id="character" value="原創可愛角色"></label>
        <label><span data-i18n="theme">主題</span><input id="theme" value="日常聊天貼圖"></label>
        <label><span data-i18n="tone">語氣</span><input id="tone" value="可愛、清楚、友善"></label>
        <label><span data-i18n="promptLanguage">語言</span><input id="language" value="繁體中文"></label>
        <label class="wide"><span data-i18n="style">風格</span><input id="style" value="粗黑線、扁平上色、適合聊天視窗縮圖閱讀"></label>
      </div>

      <div class="toolbar">
        <label class="check"><input id="with-text" type="checkbox" checked> <span data-i18n="withText">有字版</span></label>
        <label><span data-i18n="background">背景色</span>
          <select id="chroma-key">
            <option value="green">Green #00FF00</option>
            <option value="magenta">Magenta #FF00FF</option>
          </select>
        </label>
      </div>

      <div class="slots" id="slots"></div>
      <textarea id="prompt-output" spellcheck="false"></textarea>
    </section>

    <section class="panel work-panel">
      <div class="section-head">
        <h2>Grid</h2>
        <label class="file-button">
          <span data-i18n="importGrid">匯入 3x3</span>
          <input id="grid-file" type="file" accept="image/*">
        </label>
      </div>

      <div class="stage">
        <canvas id="source-canvas" width="360" height="360"></canvas>
      </div>

      <div class="actions">
        <button id="split-grid" type="button" data-i18n="split">切圖</button>
        <button id="cleanup-all" type="button" data-i18n="cleanup">去背</button>
        <button id="select-first-eight" type="button" data-i18n="selectFirstEight">選前 8 張</button>
        <button id="export-stickers" type="button" data-i18n="exportPng">匯出 9 張 PNG</button>
        <button id="export-zip" type="button" class="primary" data-i18n="exportZip">匯出 ZIP</button>
      </div>

      <details class="submission">
        <summary data-i18n="submissionTitle">LINE Creators Market 上架</summary>
        <ol>
          <li data-i18n="submission1">到 creator.line.me 登入 LINE 帳號。</li>
          <li data-i18n="submission2">新增 Sticker，填寫貼圖介紹、圖片編輯、販售資訊。</li>
          <li data-i18n="submission3">在圖片編輯頁上傳整包 ZIP，或逐張上傳 main.png、tab.png、01.png 到 08.png。</li>
          <li data-i18n="submission4">三個區段完成後點「申請販售」。通過後再手動點「上架」。</li>
        </ol>
      </details>

      <div class="tile-grid" id="tile-grid"></div>
    </section>
  </main>

  <template id="slot-template">
    <div class="slot-row">
      <span class="slot-num"></span>
      <input class="slot-text" aria-label="文字">
      <input class="slot-action" aria-label="動作">
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
