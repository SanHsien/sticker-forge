version: 2
updates:
  # Image runtime, desktop GUI, tests, maintenance, and Windows packaging.
  # Updates stay under human review because they can affect image output or the EXE.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Taipei"
    versioning-strategy: "increase"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    groups:
      runtime-minor-and-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      runtime-major:
        dependency-type: "production"
        update-types: ["major"]
      development-minor-and-patch:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      development-major:
        dependency-type: "development"
        update-types: ["major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
