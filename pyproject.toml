[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sticker-forge"
version = "0.17.0"
description = "Local-first chat sticker pack toolkit for LINE and other platforms."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "SanHsien" }]
dependencies = [
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
gui = [
    "pywebview>=5.0",
]
packaging = [
    "pyinstaller>=6.0",
    "pywebview>=5.0",
]

[project.scripts]
sticker-forge = "sticker_forge.cli:main"
sticker-forge-gui = "sticker_forge.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
