[build-system]
requires = ["setuptools>=83.0.0", "wheel>=0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sticker-forge"
version = "0.18.0"
description = "Local-first chat sticker pack toolkit for LINE and other platforms."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "SanHsien" }]
dependencies = [
    "Pillow>=12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
]
maintenance = [
    "packaging>=26.2",
]
gui = [
    "pywebview>=6.2.1",
]
packaging = [
    "pyinstaller>=6.21.0",
    "pywebview>=6.2.1",
]

[project.scripts]
sticker-forge = "sticker_forge.cli:main"
sticker-forge-gui = "sticker_forge.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
